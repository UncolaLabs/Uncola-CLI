<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" width="820" height="130" role="img" aria-label="Stop letting your career happen TO you. Track every win and own your professional story.">
  <style>
    @font-face { font-family: "PF"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "PF"; font-weight: 900; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "MS"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    text { text-anchor: middle; }
    .manifesto { font-family: "PF", "Playfair Display", Georgia, serif; font-size: 36px; font-weight: 700; fill: #2C3E50; letter-spacing: -0.5px; }
    .to { font-weight: 900; font-size: 54px; fill: #E67E22; letter-spacing: 0; }
    .manifesto.shadow { fill: none; }
    .shadow .to { fill: rgba(230, 126, 34, 0.15); }
    .sub { font-family: "MS", Montserrat, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 400; fill: #566573; }
    @media (prefers-color-scheme: dark) {
      .manifesto { fill: #E6EDF3; }
      .sub { fill: #9198A1; }
    }
  </style>
  <text class="manifesto shadow" x="412" y="54">Stop letting your career happen <tspan class="to">TO</tspan> you.</text>
  <text class="manifesto" x="410" y="52">Stop letting your career happen <tspan class="to">TO</tspan> you.</text>
  <text class="sub" x="410" y="110">Track every win and own your professional story.</text>
</svg>
