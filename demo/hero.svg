<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 110" width="820" height="110" role="img" aria-label="Your career, in your terminal, your agent, Claude, Codex, Kiro, and any agent">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 700; }
    .lead { fill: #1F2328; text-anchor: end; }
    .name { fill: #D35400; opacity: 0; animation: cycle 15s linear infinite both; }
    .name:nth-of-type(2) { animation-delay: 0s; }
    .name:nth-of-type(3) { animation-delay: 2.5s; }
    .name:nth-of-type(4) { animation-delay: 5s; }
    .name:nth-of-type(5) { animation-delay: 7.5s; }
    .name:nth-of-type(6) { animation-delay: 10s; }
    .name:nth-of-type(7) { animation-delay: 12.5s; }
    @keyframes cycle { 0% { opacity: 0; } 2.5% { opacity: 1; } 14% { opacity: 1; } 16.7% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .name { animation: none; }
      .name:nth-of-type(2) { opacity: 1; }
    }
  </style>
